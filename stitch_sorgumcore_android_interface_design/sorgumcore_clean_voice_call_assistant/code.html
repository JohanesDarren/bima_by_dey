<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>sorgumcore — Dapur Sorgum Keluarga</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      background-color: #f2f5f3;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: #2e3230;
    }
    .font-serif {
      font-family: 'Fraunces', Georgia, serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes soundwave {
      0%, 100% { height: 6px; }
      50% { height: 24px; }
    }
    .wave-1 { animation: soundwave 1.1s ease-in-out infinite 0.1s; }
    .wave-2 { animation: soundwave 1.2s ease-in-out infinite 0.3s; }
    .wave-3 { animation: soundwave 0.9s ease-in-out infinite 0.2s; }
    .wave-4 { animation: soundwave 1.4s ease-in-out infinite 0.4s; }
    .wave-5 { animation: soundwave 1.0s ease-in-out infinite 0.15s; }
    .wave-6 { animation: soundwave 1.3s ease-in-out infinite 0.35s; }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4 selection:bg-[#c8963e] selection:text-white">
<!-- Mobile Frame Wrapper -->
<main class="w-full max-w-[390px] mx-auto flex flex-col shadow-2xl rounded-[36px] overflow-hidden border-[7px] border-[#29231D] relative min-h-[820px] bg-[#faf6f0]">
<!-- Top Notch / Status Bar Area -->
<div class="w-full px-6 pt-3.5 pb-2 flex justify-between items-center text-xs text-[#74796e] select-none relative z-30">
<span class="font-semibold text-xs text-[#2e3230]">09:41</span>
<div class="w-24 h-4 bg-[#e4e0d8] rounded-full mx-auto absolute left-1/2 -translate-x-1/2 top-3 flex items-center justify-center">
<div class="w-2 h-2 rounded-full bg-[#1c2621]"></div>
</div>
<div class="flex items-center gap-1.5 text-[#2e3230]">
<span class="material-symbols-outlined text-[15px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[15px]">wifi</span>
<span class="material-symbols-outlined text-[15px]">battery_full</span>
</div>
</div>
<!-- Header Ringkas -->
<header class="px-5 pt-2 pb-3 flex items-center justify-between border-b border-[#f0ece4]">
<div class="flex items-center gap-3">
<h1 class="font-serif text-xl font-bold tracking-tight text-[#1f3323]">sorgumcore</h1>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center relative shadow-sm transition-transform active:scale-95" style="background-color: #1f3323; color: #c8963e;">
<span class="material-symbols-outlined text-[20px]">notifications</span>
<span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-[#c8963e]"></span>
</button>
</header>
<!-- Main Scrollable / Floating Content Area -->
<div class="flex-1 flex flex-col px-5 pt-3 pb-24 overflow-y-auto no-scrollbar">

<div class="rounded-2xl p-3.5 mb-3.5 flex items-center gap-3.5 shadow-md border border-[#2b3e30]" style="background-color: #1c2b20;">
<div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 font-serif font-bold text-base border border-[#2e4735]" style="background-color: #24382a; color: #c8963e;">
BS
</div>
<div class="flex-1 min-w-0">
<span class="text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-widest inline-block" style="background-color: rgba(200, 150, 62, 0.2); color: #c8963e;">
RESEP AKTIF
</span>
<h4 class="text-xs font-bold text-[#faf6f0] mt-0.5 truncate">Bubur Sorghum Pandan Gula Aren</h4>
<p class="text-[10px] text-[#9bb0a3] mt-0.5 font-medium">35 mnt • Langkah 3</p>
</div>
<span class="material-symbols-outlined text-[#c8963e] text-[20px] shrink-0">chevron_right</span>
</div>
<!-- Mode Toggle Pill -->
<div class="flex bg-[#f0ece4] p-1 rounded-xl mb-3 border border-[#e4e0d8]">
<button class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-white text-[#1f3323] shadow-sm flex items-center justify-center gap-1.5 transition-all">
<span class="material-symbols-outlined text-[16px] text-[#c8963e]">call</span> Panggilan Suara
</button>
<button class="flex-1 py-1.5 text-xs font-medium text-[#74796e] hover:text-[#1f3323] rounded-lg flex items-center justify-center gap-1.5 transition-all">
<span class="material-symbols-outlined text-[16px]">chat</span> Chat Teks
</button>

<div class="flex-1 flex flex-col items-center justify-between py-2 relative text-center">

<div class="relative flex items-center justify-center mb-5">

<div class="absolute w-44 h-44 rounded-full bg-[#8ecf9e] opacity-25 blur-2xl animate-pulse pointer-events-none"></div>

<div class="w-36 h-36 rounded-full relative flex items-center justify-center shadow-lg transition-transform hover:scale-105 duration-300" style="background: radial-gradient(circle at 35% 28%, #ffffff 0%, #e2f5e8 38%, #a3d9b2 75%, #569168 100%); box-shadow: 0 16px 32px -6px rgba(74, 124, 89, 0.35);">

<div class="flex items-center gap-4 mb-2">
<div class="w-2.5 h-3.5 bg-[#1f3323] rounded-full"></div>
<div class="w-2.5 h-3.5 bg-[#1f3323] rounded-full"></div>
</div>
<!-- Smile -->
<div class="absolute bottom-11 w-3.5 h-2 border-b-[2.5px] border-[#1f3323] rounded-b-full"></div>
<!-- Live Status Bubble Indicator -->
<div class="absolute bottom-2 right-2 w-6 h-6 rounded-full bg-[#4a7c59] border-2 border-white flex items-center justify-center shadow-md">
<span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
</div>
</div>
</div>
<!-- Title & Status -->
<h3 class="font-serif text-xl font-bold text-[#1f3323] tracking-wide mb-0.5">Chef Sorghum AI</h3>
<p class="text-xs text-[#4a7c59] font-medium tracking-wide mb-3">Sedang mendengarkan...</p>
<!-- Soundwave Animation -->
<div class="flex items-center justify-center gap-1 h-7 mb-2">
<span class="w-1 bg-[#4a7c59] rounded-full wave-1"></span>
<span class="w-1 bg-[#4a7c59] rounded-full wave-2"></span>
<span class="w-1 bg-[#4a7c59] rounded-full wave-3"></span>
<span class="w-1 bg-[#4a7c59] rounded-full wave-4"></span>
<span class="w-1 bg-[#4a7c59] rounded-full wave-5"></span>
<span class="w-1 bg-[#4a7c59] rounded-full wave-6"></span>
</div>
<!-- Call Timer -->
<span class="text-xs font-semibold text-[#74796e] tracking-wider">01:24</span>
</div>
<!-- Floating Clean Call Controls -->
<div class="w-full pt-4 pb-2 flex items-center justify-center">
<div class="bg-white/90 backdrop-blur border border-[#e4e0d8] rounded-full py-2 px-5 flex items-center justify-center gap-6 shadow-lg">
<!-- Mic Mute Button -->
<button class="w-11 h-11 rounded-full bg-[#f0ece4] text-[#1f3323] hover:bg-[#e4e0d8] flex items-center justify-center transition-all shadow-sm active:scale-95" title="Bisukan Mikrofon">
<span class="material-symbols-outlined text-[20px]">mic</span>
</button>
<!-- End Call Red Button ('X') -->
<button class="w-12 h-12 rounded-full bg-[#b83230] text-white hover:bg-[#992220] flex items-center justify-center transition-all shadow-md active:scale-95" title="Akhiri Panggilan">
<span class="material-symbols-outlined text-[24px]">call_end</span>
</button>
<!-- Speaker Button -->
<button class="w-11 h-11 rounded-full bg-[#f0ece4] text-[#1f3323] hover:bg-[#e4e0d8] flex items-center justify-center transition-all shadow-sm active:scale-95" title="Speaker">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
</button>
</div>
</div>
</div>
</div>
<!-- Bottom Navigation Bar (Fixed 3 Tabs: Beranda, Resep (active), Stok Dapur) -->
<nav class="absolute bottom-0 left-0 right-0 bg-[#faf6f0]/95 border-t border-[#f0ece4] px-6 py-2.5 flex justify-around items-center z-20 backdrop-blur-md shadow-sm">

<a class="flex flex-col items-center gap-0.5 text-[#74796e] hover:text-[#1f3323] transition-colors" href="#">
<span class="material-symbols-outlined text-[22px]">home</span>
<span class="text-[10px] font-medium">Beranda</span>
</a>
<!-- Tab 2: Resep (Active) -->
<a class="flex flex-col items-center gap-0.5 text-[#c8963e]" href="#">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">menu_book</span>
<span class="text-[10px] font-bold">Resep</span>
</a>
<!-- Tab 3: Stok Dapur -->
<a class="flex flex-col items-center gap-0.5 text-[#74796e] hover:text-[#1f3323] transition-colors" href="#">
<span class="material-symbols-outlined text-[22px]">kitchen</span>
<span class="text-[10px] font-medium">Stok Dapur</span>
</a>
</nav>
</main>
